name: public - CI

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'sass/**'
      - 'static/**'
      - 'templates/**'
      - 'config.toml'
      - '.github/workflows/publish.yml'

env:
  ZOLA_VERSION: v0.22.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download zola
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCHIVE="zola-${{ env.ZOLA_VERSION }}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "https://github.com/getzola/zola/releases/download/${{ env.ZOLA_VERSION }}/${ARCHIVE}" -o /tmp/zola.tar.gz
          gh attestation verify /tmp/zola.tar.gz --owner getzola
          sudo tar xzf /tmp/zola.tar.gz -C /usr/local/bin
      - name: Build site
        run: zola build -o public
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: public
